  #   volumes:
  #     - ./mosquitto/data:/mosquitto/data
  #     - ./mosquitto/config:/mosquitto/config

  # Node-RED (目前註解保留)
  # iot_logic:
  #   image: nodered/node-red:latest
  #   container_name: iot_logic
  #   ports:
  #     - "1880:1880"
  #   volumes:
  #     - ./nodered/data:/data
  #   depends_on:
  #     - mqtt_broker
  #     - db

  # 資料庫（MongoDB，目前註解保留）
  # db:
  #   image: mongo:latest
  #   container_name: mongo_db
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - ./mongo/data:/data/db
      
  # Ollama (給主 AI Agent 使用)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:                  
      - iot_bridge
    ports:
      - "11434:11434"
    volumes:
      - ./ai/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1   # 👈 保持模型永遠常駐在記憶體中，免去重複載入的等待時間

  # LangChain AI Agent
  ai_agent:
    build: ./ai/langchain
    container_name: ai_agent
    environment:
      - PENTEST_TARGET=192.168.0.1
      - PENTEST_AUTHORIZED_TARGETS=192.168.0.1
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - iot_bridge         
    volumes:
      - ./ai/langchain:/app
      - /var/run/docker.sock:/var/run/docker.sock  # 讓容器內部可以呼叫外部 Docker 引擎
      - ./ai/langchain/data:/app/data
    working_dir: /app
    command: python main.py
    depends_on:
      - ollama
      # - db
      # - mqtt_broker
  
  # RAG Ollama
  rag-ollama:
    image: ollama/ollama:latest
    container_name: RAG-ollama
    ports:
      - "11435:11434"
    cpus: 2
    mem_limit: 4g
    environment:
      - OLLAMA_NUM_PARALLEL=2  
      - OLLAMA_KEEP_ALIVE=-1   # 👈 RAG 的模型也設定常駐
    networks:
      - iot_bridge         
    volumes:
      - ./RAG/ollama:/root/.ollama
  
  # RAG Python 服務
  rag:
    build: ./RAG                     
    container_name: RAG
    depends_on:
      - rag-ollama
    working_dir: /app
    tty: true
    stdin_open: true
    cpus: 2
    mem_limit: 4g
    environment:
      - OMP_NUM_THREADS=1            
      - MKL_NUM_THREADS=1            
      - OLLAMA_HOST=http://RAG-ollama:11434  
    networks:
      - iot_bridge
    volumes:
      - ./RAG:/app                     

networks:
    iot_bridge:
      name: iot_bridge 
      external: true
